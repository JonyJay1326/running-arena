function actionText(a){if(a.unplayable)return '声明不可打';const p=a.attack||a.fly;return (a.fly?'纸飞机':names[p.kind]||p.kind)+` · ${p.angle.toFixed(2)}° / 力度 ${p.power.toFixed(2)} · ${p.dir===1?'向右':'向左'}`+(a.moveX!==undefined?` · 站位 x=${a.moveX}`:'');}

async function load(){const mine=++generation;aborter?.abort();aborter=new AbortController();playing=false;current=null;view=null;t=0;$('error').hidden=true;$('status').textContent='正在加载正式回放…';ctx.clearRect(0,0,1600,900);$('turns').replaceChildren();for(const e of document.querySelectorAll('.controls button,.controls input'))e.disabled=true;document.querySelectorAll('#holes button').forEach((b,i)=>b.classList.toggle('active',i===hi));document.querySelectorAll('#players button').forEach((b,i)=>b.classList.toggle('active',i===ri));$('title').textContent=`${entry().number} ${entry().name} · ${route().name}`;$('meta').textContent=`标准杆 ${entry().hole.par} · 风 ${entry().hole.wind} · 第一轮正式记录`;$('summary').textContent=`${route().completed?'✓ 完成':'✗ 未完成'} · 最终计分 ${route().score}（${route().score-entry().hole.par>=0?'+':''}${route().score-entry().hole.par}） · 实际 ${route().actualStrokes} 杆 · 罚 ${route().penalties}`;$('replay-link').href=route().file;try{const response=await fetch(route().file,{signal:aborter.signal});if(!response.ok)throw Error(`HTTP ${response.status}`);let parsed;if(route().file.endsWith('.gz')){parsed=await new Response(response.body.pipeThrough(new DecompressionStream('gzip'))).json();}else{parsed=await response.json();}if(mine!==generation)return;current=parsed;$('time').max=end();makeTable();draw();for(const e of document.querySelectorAll('.controls button,.controls input'))e.disabled=false;}catch(error){if(error.name==='AbortError')return;$('error').hidden=false;$('error').textContent='回放加载失败：'+error.message;$('status').textContent='请检查本地服务后刷新。';}}
